name: App compatibility report
description: Tell us how a specific app behaves as a clone
labels: [compatibility]
body:
  - type: input
    id: app
    attributes:
      label: App and version
      placeholder: Discord 0.0.330
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: How did it go?
      options:
        - Works great
        - Works with limits
        - Doesn't work
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What worked, what didn't (login, notifications, data separation, updates)?
  - type: textarea
    id: doctor
    attributes:
      label: Output of `mitosis doctor <App>`
      render: text
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
