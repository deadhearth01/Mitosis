name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        # Launch tests open small GUI apps through LaunchServices, which CI runners don't allow reliably.
        env:
          MITOSIS_SKIP_LAUNCH_TESTS: "1"
        run: swift test
      - name: Build the app bundle
        run: scripts/build-app.sh
