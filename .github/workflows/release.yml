name: Release

# On a version tag, builds Mitosis.app and creates a draft release with the zip and its checksum.
# If a release for the tag already exists (for example one published from a local build), this does nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example v0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Skip if the release exists
        id: check
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.check.outputs.skip != 'true'
        with:
          xcode-version: latest-stable
      - name: Build and package
        if: steps.check.outputs.skip != 'true'
        run: scripts/package-release.sh
      - name: Create draft release
        if: steps.check.outputs.skip != 'true'
        run: |
          VERSION="${TAG#v}"
          gh release create "$TAG" --draft --title "Mitosis $VERSION" --notes "See CHANGELOG.md for what's new." \
            "dist/Mitosis-$VERSION.zip" "dist/Mitosis-$VERSION.zip.sha256"
