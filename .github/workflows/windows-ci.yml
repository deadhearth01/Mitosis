name: Windows CI

# Validates the Windows port (WinUI 3, .NET 10) without touching macOS workflows.
# Read-only: no secrets, no signing, no publishing, no deployment.

on:
  push:
    branches: [WindowsVersion]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Restore, build, and test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # windows/global.json pins 10.0.100 with latestFeature roll-forward.
          dotnet-version: 10.0.x
      - name: Toolchain
        run: dotnet --info
      - name: Restore
        run: dotnet restore Mitosis.sln
      - name: Build (Release)
        run: dotnet build Mitosis.sln -c Release --no-restore
      - name: Test (Release)
        run: dotnet test --solution Mitosis.sln -c Release --no-build --report-trx
      - name: Upload test results
        # defaults.run.working-directory does not apply here: path is repo-rooted.
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: windows/TestResults/*.trx
          retention-days: 14

  publish-release-candidate:
    name: Publish x64 release candidate
    # Separate from build-test so ordinary test results and the release artifact
    # stay distinguishable. Uses the same pinned recipe as local runs
    # (windows/scripts/publish-release.ps1, documented in docs/WINDOWS-RELEASE.md).
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish and package
        run: powershell -ExecutionPolicy Bypass -File scripts\publish-release.ps1
      - name: Verify release candidate
        # Stage 19: the archive that is about to be uploaded is verified
        # independently (ZIP enumeration + extraction, required runtime files,
        # pose assets, x64 architecture, embedded icon, version coherence,
        # .sha256 sidecar). A failing exit code aborts before upload, so an
        # invalid artifact is never attached to the CI result.
        run: dotnet run --project tools\ReleaseVerifier -c Release -- --archive (Get-Item artifacts\Mitosis-windows-*.zip).FullName
      - name: Upload release candidate
        # Read-only distribution heritage: this produces a named CI artifact for
        # manual inspection and download — nothing is published externally, signed,
        # or attached to a release page in this stage. The verification sidecar
        # ships alongside the archive so its SHA-256 is downloadable too.
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidate
          path: |
            windows/artifacts/Mitosis-windows-*.zip
            windows/artifacts/Mitosis-windows-*.zip.sha256
          retention-days: 14
