name: Bug report
description: Something in Mitosis doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Which app were you cloning?
      placeholder: Slack 4.41.105
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `mitosis doctor <App>`
      render: text
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.4 (Apple silicon)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mitosis version
      description: Run `mitosis --version`
    validations:
      required: true
